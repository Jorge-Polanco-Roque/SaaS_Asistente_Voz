# ------------------------------------------------------------
# ElevenLabs tool descriptions
# Used by configure_elevenlabs.py when registering tools
# ------------------------------------------------------------
tool_descriptions:
  check_availability: >-
    Verifica la disponibilidad de mesas para una fecha, hora y numero de personas.
    SIEMPRE usa esta herramienta ANTES de crear una reserva.
  create_reservation: >-
    Crea una nueva reserva. Verifica disponibilidad primero.
    NO menciones codigos de reserva al cliente, solo confirma la reserva con fecha, hora y nombre.
  search_reservations: >-
    Busca las reservas de un cliente por su numero de telefono (solo numeros).
  cancel_reservation: >-
    Cancela una reserva. Primero busca la reserva con search_reservations usando el telefono del cliente.
  modify_reservation: >-
    Modifica fecha y/o hora de una reserva. Primero busca la reserva con search_reservations.
  update_notes: >-
    Agrega notas a una reserva existente. Usa esto para agregar restricciones alimenticias,
    alergias, peticiones especiales, celebraciones, o cualquier informacion adicional
    DURANTE la conversacion. Las notas se AGREGAN a las existentes.

