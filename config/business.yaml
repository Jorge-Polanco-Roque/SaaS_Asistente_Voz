business_name: "Bella Italia"
business_type: "restaurante"

# ------------------------------------------------------------
# Reservation settings
# ------------------------------------------------------------
reservation:
  duration_hours: 2.0
  max_party_size: 20
  min_party_size: 1
  phone_min_digits: 7

